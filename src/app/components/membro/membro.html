@if (membro$ | async; as membros) {
    <h2 class="font-semibold mt-6 underline">Membros Salvos</h2>
    <table class="w-lg mt-6">
        <thead class="border">
            <tr >
                <th class="items-start justify-start text-start px-2 border">Id</th>
                <th class="items-start justify-start text-start px-2 border">Nome</th>
                <th class="items-start justify-start text-start px-2 border">Cargo</th>
                <th class="items-start justify-start text-start px-2 border">FK</th>
            </tr>
        </thead>
        <tbody class=" p-3">
            @for(membro of membros; track membro.id) {
                <tr >
                    <td class=" pr-3 border">{{ membro.id }}</td>
                    <td class=" pr-3 border">{{ membro.nome }}</td>
                    <td class=" pr-3 border">{{ membro.cargo }}</td>
                    <td class=" pr-3 border">{{ membro.userId }}</td>
                </tr>
                    }@empty {
                    <p>Nenhum membro encontrado.</p>
            }

        </tbody>
    </table>
  }
