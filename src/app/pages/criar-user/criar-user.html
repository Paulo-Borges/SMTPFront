<form [formGroup]="form" (ngSubmit)="onSubmit()" class="w-lg flex flex-col justify-center items-center my-12 space-y-6 ">
    <label class="flex flex-col">
        <span>Nome</span>
        <input formControlName="nome" type="text" class="border rounded p-2 w-lg" />
      </label>
    
      <label class="flex flex-col">
        <span>E-mail</span>
        <input formControlName="email" type="email" class="border rounded p-2 w-lg"  />
      </label>
    
      <label class="flex flex-col">
        <span>CPF (apenas números)</span>
        <input formControlName="cpf" type="text" maxlength="11" class="border rounded p-2 w-lg" />
      </label>
    
      <button 
        type="submit" 
        class="bg-green-600 hover:bg-green-700 text-white p-2 rounded disabled:opacity-50 w-lg">
        Salvar
      </button>

    <p class="mt-6 text-end text-sm w-full">
        <a routerLink="/login" class="">Login</a>
    </p>
</form>
